<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 270" width="1200" height="270" role="img" aria-label="RAG pipeline architecture">
<title>Course Notes RAG pipeline</title>
<rect x="0" y="0" width="1200" height="270" fill="#ffffff"/>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#7F77DD" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text x="20" y="32" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#5F5E5A">Build once (offline)</text>

<rect x="20" y="50" width="205" height="86" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="122" y="80" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0C447C">Corpus</text>
<text x="122" y="103" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#185FA5">13 course text guides</text>
<text x="122" y="121" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#185FA5">276,888 characters</text>

<rect x="267" y="50" width="205" height="86" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="369" y="80" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0C447C">Chunk</text>
<text x="369" y="103" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#185FA5">Recursive, 300 / 50 overlap</text>
<text x="369" y="121" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#185FA5">1,342 chunks</text>

<rect x="514" y="50" width="205" height="86" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="616" y="80" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0C447C">Embed</text>
<text x="616" y="103" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#185FA5">all-MiniLM-L6-v2 (local)</text>
<text x="616" y="121" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#185FA5">384-dim vectors</text>

<rect x="761" y="50" width="205" height="86" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="863" y="80" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0C447C">Index</text>
<text x="863" y="103" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#185FA5">FAISS IndexFlatIP</text>
<text x="863" y="121" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#185FA5">cosine similarity</text>

<rect x="1008" y="50" width="172" height="86" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="1094" y="80" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#3C3489">Search</text>
<text x="1094" y="103" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#534AB7">semantic + TF-IDF</text>
<text x="1094" y="121" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#534AB7">top-k retrieval</text>

<path d="M229 93 L261 93" fill="none" stroke="#7F77DD" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M476 93 L508 93" fill="none" stroke="#7F77DD" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M723 93 L755 93" fill="none" stroke="#7F77DD" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M970 93 L1002 93" fill="none" stroke="#7F77DD" stroke-width="1.5" marker-end="url(#a)"/>

<text x="20" y="178" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#5F5E5A">Every question</text>

<rect x="20" y="194" width="272" height="58" rx="10" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
<text x="156" y="217" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#2C2C2A">React UI (Vite + TypeScript)</text>
<text x="156" y="237" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5F5E5A">question, settings, source cards</text>

<rect x="334" y="194" width="272" height="58" rx="10" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
<text x="470" y="217" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#2C2C2A">FastAPI + retrieval</text>
<text x="470" y="237" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5F5E5A">augmented prompt, score guardrail</text>

<rect x="648" y="194" width="272" height="58" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="784" y="217" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#3C3489">Groq gpt-oss-120b</text>
<text x="784" y="237" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#534AB7">free tier, OpenAI-compatible</text>

<rect x="962" y="194" width="218" height="58" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="1071" y="217" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#085041">Grounded answer</text>
<text x="1071" y="237" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#0F6E56">streamed, with citations</text>

<path d="M296 223 L328 223" fill="none" stroke="#7F77DD" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M610 223 L642 223" fill="none" stroke="#7F77DD" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M924 223 L956 223" fill="none" stroke="#7F77DD" stroke-width="1.5" marker-end="url(#a)"/>
</svg>
